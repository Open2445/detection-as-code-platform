title: LSASS Memory Dump via ProcDump or Task Manager
name: lsass_memory_dump
status: experimental
description: Detects attempts to dump LSASS process memory for credential extraction
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Detection-as-Code Platform
date: 2024/01/01
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_procdump:
    Image|endswith: '\procdump.exe'
    CommandLine|contains:
      - 'lsass'
      - '-ma'
  selection_comsvcs:
    CommandLine|contains:
      - 'comsvcs.dll'
      - 'MiniDump'
  selection_keywords:
    CommandLine|contains:
      - 'lsass.dmp'
      - 'lsass.exe'
  condition: selection_procdump or selection_comsvcs
falsepositives:
  - Legitimate crash dump generation by crash reporting tools
level: critical
