title: Certutil Used for File Download
name: certutil_download
status: experimental
description: Detects use of certutil.exe to download files from the internet, a common Living-off-the-Land technique
references:
  - https://attack.mitre.org/techniques/T1105/
author: Detection-as-Code Platform
date: 2024/01/01
tags:
  - attack.command-and-control
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\certutil.exe'
    CommandLine|contains:
      - 'urlcache'
      - '-urlcache'
      - '-decode'
      - '-encode'
      - 'http://'
      - 'https://'
      - 'ftp://'
  condition: selection
falsepositives:
  - Legitimate certificate management operations
level: high
