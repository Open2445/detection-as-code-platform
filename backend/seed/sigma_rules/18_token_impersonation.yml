title: Token Impersonation via SeImpersonatePrivilege
name: token_impersonation
status: experimental
description: Detects potential token impersonation/theft via known tools or technique indicators
references:
  - https://attack.mitre.org/techniques/T1134/001/
author: Detection-as-Code Platform
date: 2024/01/01
tags:
  - attack.privilege-escalation
  - attack.t1134.001
logsource:
  category: process_creation
  product: windows
detection:
  keywords:
    - 'SeImpersonatePrivilege'
    - 'incognito'
    - 'getsystem'
    - 'token::elevate'
    - 'juicypotato'
    - 'rottenpotato'
    - 'sweetpotato'
    - 'printspoofer'
  condition: keywords
falsepositives:
  - Legitimate privileged operations by system services
level: high
