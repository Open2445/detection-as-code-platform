title: Mimikatz Credential Dumping
name: mimikatz_credential_dumping
status: experimental
description: Detects execution of Mimikatz credential dumping tool via process name or known command arguments
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Detection-as-Code Platform
date: 2024/01/01
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_name:
    Image|contains:
      - 'mimikatz'
      - 'mimimikatz'
  selection_args:
    CommandLine|contains:
      - 'sekurlsa::logonpasswords'
      - 'sekurlsa::wdigest'
      - 'lsadump::sam'
      - 'lsadump::dcsync'
      - 'privilege::debug'
      - 'crypto::capi'
  condition: 1 of selection*
falsepositives:
  - Security research environments
level: critical
