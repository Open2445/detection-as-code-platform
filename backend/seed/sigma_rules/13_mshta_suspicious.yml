title: Mshta Suspicious Script Execution
name: mshta_suspicious_execution
status: experimental
description: Detects mshta.exe executing scripts from remote locations or with suspicious parameters
references:
  - https://attack.mitre.org/techniques/T1218/005/
author: Detection-as-Code Platform
date: 2024/01/01
tags:
  - attack.defense-evasion
  - attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\mshta.exe'
    CommandLine|contains:
      - 'javascript:'
      - 'vbscript:'
      - 'http://'
      - 'https://'
      - '.hta'
  condition: selection
falsepositives:
  - Legitimate HTA-based enterprise applications
level: high
