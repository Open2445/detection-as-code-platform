title: Admin Share Access
name: admin_share_access
status: experimental
description: Detects access to Windows administrative shares (C$, ADMIN$, IPC$) used for lateral movement
references:
  - https://attack.mitre.org/techniques/T1021/002/
author: Detection-as-Code Platform
date: 2024/01/01
tags:
  - attack.lateral-movement
  - attack.t1021.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - '\\\\*\\c$'
      - '\\\\*\\admin$'
      - '\\\\*\\ipc$'
      - 'net use'
    CommandLine|contains:
      - '\\c$'
      - '\\admin$'
      - '\\IPC$'
  condition: selection
falsepositives:
  - Legitimate administrative access to remote systems
level: medium
