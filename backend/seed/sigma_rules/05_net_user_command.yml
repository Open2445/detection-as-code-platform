title: Net User Account Enumeration or Creation
name: net_user_command
status: experimental
description: Detects use of net user command to enumerate or create user accounts
references:
  - https://attack.mitre.org/techniques/T1136/
author: Detection-as-Code Platform
date: 2024/01/01
tags:
  - attack.persistence
  - attack.t1136
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
    CommandLine|contains:
      - 'net user'
      - 'net1 user'
  condition: selection
falsepositives:
  - Legitimate user management by administrators
level: medium
