title: Pass-the-Hash Attack via NTLM
name: pass_the_hash_ntlm
status: experimental
description: Detects potential Pass-the-Hash attack indicators including suspicious NTLM authentication patterns
references:
  - https://attack.mitre.org/techniques/T1550/002/
author: Detection-as-Code Platform
date: 2024/01/01
tags:
  - attack.defense-evasion
  - attack.lateral-movement
  - attack.t1550.002
logsource:
  category: process_creation
  product: windows
detection:
  keywords:
    - 'sekurlsa::pth'
    - 'Pass-the-Hash'
    - 'overpass-the-hash'
    - '/ntlm:'
    - 'pth-winexe'
  condition: keywords
falsepositives:
  - Security testing tools in authorized red team exercises
level: critical
