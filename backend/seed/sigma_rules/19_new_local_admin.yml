title: New Local Administrator Account Created
name: new_local_admin_account
status: experimental
description: Detects creation of a new local administrator account, which may indicate privilege escalation or persistence
references:
  - https://attack.mitre.org/techniques/T1136/001/
author: Detection-as-Code Platform
date: 2024/01/01
tags:
  - attack.persistence
  - attack.t1136.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
    CommandLine|contains:
      - 'localgroup'
      - 'Administrators'
      - '/add'
  condition: selection
falsepositives:
  - Legitimate user provisioning by administrators
level: high
