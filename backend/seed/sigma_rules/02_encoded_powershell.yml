title: Encoded PowerShell Command
name: encoded_powershell_command
status: experimental
description: Detects PowerShell execution with base64-encoded commands using -EncodedCommand or -enc flags
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: Detection-as-Code Platform
date: 2024/01/01
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - ' -e '
      - ' -en '
      - ' -enc '
      - ' -EncodedCommand '
      - ' -encodedcommand '
  condition: selection
falsepositives:
  - Some legitimate tools use encoded commands
level: high
