title: Suspicious BITS Job Creation
name: suspicious_bits_job
status: experimental
description: Detects suspicious Background Intelligent Transfer Service jobs used for stealthy download/upload
references:
  - https://attack.mitre.org/techniques/T1197/
author: Detection-as-Code Platform
date: 2024/01/01
tags:
  - attack.defense-evasion
  - attack.t1197
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\bitsadmin.exe'
    CommandLine|contains:
      - '/transfer'
      - '/create'
      - '/addfile'
      - '/SetNotifyCmdLine'
      - 'http://'
      - 'https://'
  condition: selection
falsepositives:
  - Legitimate Windows Update and software delivery mechanisms
level: medium
