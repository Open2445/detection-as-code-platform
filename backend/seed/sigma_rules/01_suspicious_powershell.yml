title: Suspicious PowerShell Execution
name: suspicious_powershell_execution
status: experimental
description: Detects suspicious PowerShell execution with common attacker flags like bypass, hidden, or noprofile
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: Detection-as-Code Platform
date: 2024/01/01
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - '-ExecutionPolicy Bypass'
      - '-ep bypass'
      - '-noprofile'
      - '-NonInteractive'
      - '-WindowStyle Hidden'
      - '-w hidden'
  condition: selection
falsepositives:
  - Legitimate administrative scripts
level: medium
