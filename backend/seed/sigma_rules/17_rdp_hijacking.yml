title: RDP Session Hijacking
name: rdp_session_hijacking
status: experimental
description: Detects RDP session hijacking via tscon or Windows Terminal Services manipulation
references:
  - https://attack.mitre.org/techniques/T1563/002/
author: Detection-as-Code Platform
date: 2024/01/01
tags:
  - attack.lateral-movement
  - attack.t1563.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\tscon.exe'
  selection_sc:
    Image|endswith: '\sc.exe'
    CommandLine|contains:
      - 'rdp-tcp'
      - 'termservice'
      - 'TermService'
  condition: 1 of selection*
falsepositives:
  - Legitimate RDP session management by administrators
level: high
