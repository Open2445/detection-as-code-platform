title: WMI Event Subscription for Persistence
name: wmi_event_subscription
status: experimental
description: Detects creation of WMI event subscriptions used for persistence mechanisms
references:
  - https://attack.mitre.org/techniques/T1546/003/
author: Detection-as-Code Platform
date: 2024/01/01
tags:
  - attack.persistence
  - attack.t1546.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\wmic.exe'
    CommandLine|contains:
      - 'ActiveScriptEventConsumer'
      - 'CommandLineEventConsumer'
      - '__EventFilter'
      - '__EventConsumer'
      - '__FilterToConsumerBinding'
      - 'subscription'
  condition: selection
falsepositives:
  - Legitimate WMI management scripts used by system administrators
level: high
