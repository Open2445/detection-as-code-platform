title: Regsvr32 Suspicious Network Activity
name: regsvr32_network_connection
status: experimental
description: Detects regsvr32.exe loading scripts from remote URLs (Squiblydoo/ATT&CK T1218.010)
references:
  - https://attack.mitre.org/techniques/T1218/010/
author: Detection-as-Code Platform
date: 2024/01/01
tags:
  - attack.defense-evasion
  - attack.t1218.010
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\regsvr32.exe'
    CommandLine|contains:
      - '/u'
      - '/s'
      - 'http://'
      - 'https://'
      - 'scrobj.dll'
  condition: selection
falsepositives:
  - Legitimate COM component registration
level: high
