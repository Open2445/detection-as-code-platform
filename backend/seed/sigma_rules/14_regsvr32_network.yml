title: Regsvr32 Remote Scriptlet Execution
name: regsvr32_remote_scriptlet_execution
status: experimental
description: Detects regsvr32.exe loading scripts from remote URLs (Squiblydoo/ATT&CK T1218.010)
references:
  - https://attack.mitre.org/techniques/T1218/010/
author: Detection-as-Code Platform
date: 2024/01/01
tags:
  - attack.defense-evasion
  - attack.t1218.010
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\regsvr32.exe'
  selection_url:
    CommandLine|contains:
      - 'http://'
      - 'https://'
  selection_flags:
    CommandLine|contains|all:
      - '/i:'
      - 'scrobj.dll'
  condition: all of selection_*
falsepositives:
  - Legitimate COM component registration
level: high
