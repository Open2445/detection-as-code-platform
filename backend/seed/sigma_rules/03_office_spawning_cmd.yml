title: Office Application Spawning Command Shell
name: office_spawning_cmd_shell
status: experimental
description: Detects Microsoft Office applications spawning command-line interpreters, a common sign of macro-based malware or phishing exploits
references:
  - https://attack.mitre.org/techniques/T1204/002/
author: Detection-as-Code Platform
date: 2024/01/01
tags:
  - attack.execution
  - attack.t1204.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|contains:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
      - '\onenote.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Legitimate macro-enabled business documents
level: high
