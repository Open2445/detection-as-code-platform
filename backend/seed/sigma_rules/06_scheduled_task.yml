title: Scheduled Task Creation via schtasks
name: scheduled_task_creation
status: experimental
description: Detects creation of scheduled tasks using schtasks.exe, often used for persistence
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: Detection-as-Code Platform
date: 2024/01/01
tags:
  - attack.persistence
  - attack.execution
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/create'
  condition: selection
falsepositives:
  - Legitimate software installers, system maintenance tasks
level: medium
